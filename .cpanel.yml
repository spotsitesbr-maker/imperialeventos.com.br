    - /bin/bash -c "if [ -f $HOME/public_html/index.php ]; then cp -f $HOME/public_html/index.php $HOME/public_html/index.php.bak && mv -f $HOME/public_html/index.php $HOME/public_html/index.php.disabled; fi"
    - /bin/cp -rf index.html googled75059461cbe7b3f.html robots.txt sitemap.xml .htaccess orcamento galeria imperial-kids politica-de-privacidade $HOME/public_html/
    - /bin/chmod 644 $HOME/public_html/index.html $HOME/public_html/googled75059461cbe7b3f.html $HOME/public_html/robots.txt $HOME/public_html/sitemap.xml $HOME/public_html/.htaccess 2>/dev/null || true
    - /bin/chmod -R 755 $HOME/public_html/orcamento $HOME/public_html/galeria $HOME/public_html/imperial-kids $HOME/public_html/politica-de-privacidade 2>/dev/null || true
