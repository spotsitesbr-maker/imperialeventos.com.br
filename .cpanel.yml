---
deployment:
  tasks:
    - /bin/bash -c "chmod 755 $HOME $HOME/public_html 2>/dev/null || true"
    - /bin/bash -c "cp -f index.html $HOME/public_html/index.html"
    - /bin/bash -c "cp -f .htaccess $HOME/public_html/.htaccess 2>/dev/null || true"
    - /bin/bash -c "cp -f robots.txt sitemap.xml $HOME/public_html/ 2>/dev/null || true"
    - /bin/bash -c "mv -f $HOME/public_html/index.php $HOME/public_html/index.php.bak 2>/dev/null || true"
    - /bin/bash -c "find $HOME/public_html -type d -exec chmod 755 {} + 2>/dev/null || true"
    - /bin/bash -c "find $HOME/public_html -type f -exec chmod 644 {} + 2>/dev/null || true"
